# 地點名稱表（房子）：名字 → 座標。用 --places house（或 export NAV_PLACES=house）選這張表。
#
# 座標是地圖座標（maps/house_map_v2 和導航用的 house_map_v2_fixed 一樣）。SLAM 把地圖原點放在機器人出生的地方
# （世界座標 -2.0, -0.5，面向右）→ 地圖座標 = 世界座標 + (2.0, 0.5)。
#   x、y：公尺（x 往右、y 往上）；yaw：到了要面向哪裡（度：0 = 右、90 = 上、180 = 左、-90 = 下）
# 每個房間選一個「站在這裡、面向這個方向，相機看得到房間裡的東西」的位置（格局：house_plan.py route 會畫出平面圖）。
# 機器人出生在房子外面的前院；要從大門進玄關，才能到其他房間。
places:
  起點:   {x: 0.0,  y: 0.0,  yaw: 0}     # 前院，機器人出生的地方（面向大門那一側）
  前院:   {x: 0.0,  y: -0.4, yaw: 0}     # 起點往外 0.4 公尺（起點離牆太近，回前院時停這裡；測驗每題從這裡出發）
  玄關:   {x: 3.2,  y: 0.9,  yaw: 90}    # 進大門後的走廊
  客廳:   {x: -2.4, y: 3.1,  yaw: 63}    # 斜斜面向沙發（原本的位置離桌腳只有 0.5 公尺，太擠，120 秒到不了）
  儲藏室: {x: -4.4, y: 3.7,  yaw: 90}    # 面向書架
  廚房:   {x: -4.3, y: -0.8, yaw: -90}   # 面向冰箱；杯子在正前方約 1.5 公尺的地上
  書房:   {x: 5.0,  y: 3.3,  yaw: 0}     # 面向大理石桌（YOLO 認不出）；原本 x 5.5 離桌腳只有 40 公分，轉身離開會卡住
  小房間: {x: 3.2,  y: 3.5,  yaw: -60}   # 面向垃圾桶（原本面向北邊的牆，只看到一堆看錯的東西）
  餐廳:   {x: 8.2,  y: -0.5, yaw: -90}   # 面向椅子和咖啡桌（椅子 0.87）

# 出生點離房子南牆只有 25 公分：在代價地圖裡等於「貼著牆」（Nav2 預設的機器人半徑 0.22 ＋ 地圖每格 5 公分的誤差），
# Nav2 第一趟會規劃不出路（實測：兩次 SLAM 畫的牆一次在 0.20、一次在 0.30，真正的牆面在 0.25）
# → set_start 設好起點後，先轉向南（-90 度）、往外開 0.3 公尺
start_step_out: {turn: -90, distance: 0.3}

# 房間的範圍（地圖座標的長方形：x 從…到…、y 從…到…）。where_am_i 用來回答「機器人在哪個房間」；都不在 → 前院。
# 從房子平面圖的牆換算（世界座標 + (2.0, 0.5)）。
rooms:
  廚房:   {x: [-5.6, -3.2], y: [-3.5, 1.5]}
  儲藏室: {x: [-5.6, -3.2], y: [1.5, 5.8]}
  客廳:   {x: [-3.2, 2.0],  y: [0.3, 5.8]}
  玄關:   {x: [2.0, 4.3],   y: [0.3, 1.5]}
  小房間: {x: [2.0, 4.3],   y: [1.5, 5.8]}
  書房:   {x: [4.3, 9.5],   y: [0.3, 5.8]}
  餐廳:   {x: [6.9, 9.5],   y: [-4.8, 0.3]}

# 畫地圖用的巡邏路線（ros2 run nav_tools explore --places house，照順序開；house_plan.py route 會畫出路線圖）
# 從房子的設計檔算出牆、門、家具的位置（house_plan.py），再照先前試跑的經驗排點：
#   - 窄門（0.9 公尺）兩側各一個點：先開到門口、再進房間；離開時也先回門口（不然 Nav2 會想穿過還沒看到的牆）
#   - 每個點離牆和家具至少 0.5 公尺；下一個點都在雷射（3.5 公尺）已經看過的範圍裡
#   - 最後回到起點（繞回走過的地方 = 迴圈閉合，SLAM 會趁機修正累積的誤差）
# 每到一個點就面向下一個點，不用另外寫方向。
explore:
  - {name: 前院,         x: 2.0,  y: -0.5}
  - {name: 大門外,       x: 3.5,  y: -0.5}
  - {name: 玄關,         x: 3.1,  y: 0.9}
  - {name: 客廳入口,     x: 1.3,  y: 0.9}
  - {name: 客廳中央,     x: 0.0,  y: 1.7}
  - {name: 客廳北邊,     x: 0.5,  y: 4.4}
  - {name: 儲藏室入口,   x: -2.5, y: 3.8}
  - {name: 儲藏室門口,   x: -3.3, y: 3.8}
  - {name: 儲藏室,       x: -4.3, y: 3.8}
  - {name: 廚房門外,     x: -4.3, y: 2.1}
  - {name: 廚房門內,     x: -4.3, y: 0.7}
  - {name: 廚房,         x: -4.4, y: -1.0}
  - {name: 廚房門內,     x: -4.3, y: 0.7}
  - {name: 廚房門外,     x: -4.3, y: 2.1}
  - {name: 儲藏室入口,   x: -2.5, y: 3.8}
  - {name: 客廳入口,     x: 1.3,  y: 0.9}
  - {name: 玄關,         x: 3.1,  y: 0.9}
  - {name: 書房門內,     x: 5.0,  y: 0.9}
  - {name: 書房中央,     x: 6.0,  y: 2.1}
  - {name: 書房東邊,     x: 8.5,  y: 2.0}
  - {name: 書房北邊,     x: 8.3,  y: 4.5}
  - {name: 小房間門外,   x: 5.0,  y: 5.1}
  - {name: 小房間門內,   x: 3.6,  y: 5.1}
  - {name: 小房間,       x: 3.1,  y: 3.5}
  - {name: 小房間門內,   x: 3.6,  y: 5.1}
  - {name: 小房間門外,   x: 5.0,  y: 5.1}
  - {name: 餐廳門外,     x: 8.2,  y: 1.05}
  - {name: 餐廳門內,     x: 8.2,  y: -0.4}
  - {name: 餐廳,         x: 7.5,  y: -1.1}
  - {name: 餐廳門內,     x: 8.2,  y: -0.4}
  - {name: 餐廳門外,     x: 8.2,  y: 1.05}
  - {name: 書房門內,     x: 5.0,  y: 0.9}
  - {name: 玄關,         x: 3.1,  y: 0.9}
  - {name: 大門外,       x: 3.5,  y: -0.5}
  - {name: 起點,         x: 0.0,  y: 0.0}
